ModelCheckpoint_best:
  filename: bst-ep{epoch}-auroc-{all/valid_auroc:.3f}
  monitor: all/valid_auroc
  save_last: true
  save_top_k: 1
  mode: max
  auto_insert_metric_name: false
  save_weights_only: false
  save_on_train_epoch_end: false

ModelCheckpoint_every10:
  filename: ep{epoch}-auroc-{all/valid_auroc:.3f}
  every_n_epochs: 15
  save_top_k: -1
  auto_insert_metric_name: false
  save_weights_only: false
  save_on_train_epoch_end: false

LearningRateMonitor:
  logging_interval: epoch
  log_momentum: false